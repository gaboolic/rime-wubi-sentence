name: nightly

# 参考 rime-frost：每次 push 到任一分支都会重新打包并更新 nightly release。
on:
  push:
    branches:
      - master
      - tiger
      - ziyuan
      - yucloud
      - yustar
  schedule:
    # 每天 01:00 北京时间（UTC 17:00）
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            name: wubi86
            asset: rime-wubi86-schemas.zip
          - branch: tiger
            name: tiger
            asset: rime-tiger-schemas.zip
          - branch: ziyuan
            name: ziyuan
            asset: rime-ziyuan-schemas.zip
          - branch: yucloud
            name: yucloud
            asset: rime-yucloud-schemas.zip
          - branch: yustar
            name: yustar
            asset: rime-yustar-schemas.zip

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate rime zip for ${{ matrix.name }}
        run: |
          python program/release/generate_rime_all_schema_zip.py "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-nightly:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code (for tag push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all nightly zips
        uses: actions/download-artifact@v4
        with:
          path: nightly
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh nightly/*.zip

      - name: Update nightly tag
        run: |
          git tag -f nightly
          git push origin refs/tags/nightly --force

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Automated nightly build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - wubi86 (master): rime-wubi86-schemas.zip
            - tiger: rime-tiger-schemas.zip
            - ziyuan: rime-ziyuan-schemas.zip
            - yucloud: rime-yucloud-schemas.zip
            - yustar: rime-yustar-schemas.zip
          files: |
            nightly/rime-wubi86-schemas.zip
            nightly/rime-tiger-schemas.zip
            nightly/rime-ziyuan-schemas.zip
            nightly/rime-yucloud-schemas.zip
            nightly/rime-yustar-schemas.zip
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || github.token }}
