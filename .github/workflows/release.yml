name: release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            name: wubi86
            asset: rime-wubi86-schemas.zip
          - branch: tiger
            name: tiger
            asset: rime-tiger-schemas.zip
          - branch: ziyuan
            name: ziyuan
            asset: rime-ziyuan-schemas.zip
          - branch: yucloud
            name: yucloud
            asset: rime-yucloud-schemas.zip
          - branch: yustar
            name: yustar
            asset: rime-yustar-schemas.zip

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate rime zip for ${{ matrix.name }}
        run: |
          python program/release/generate_rime_all_schema_zip.py "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || github.token }}
